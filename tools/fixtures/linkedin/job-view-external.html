<!DOCTYPE html>
<!-- A reduced model of a /jobs/view/<id>/ page (older "jobs-unified-top-card" markup) whose Apply
     button goes to the company's own site — not Easy Apply. -->
<html lang="en">
<head><title>Staff Engineer | Globex | LinkedIn</title></head>
<body>
<header id="global-nav"><a class="global-nav__me" href="/in/me/">Me</a></header>
<main class="job-view-layout">
  <div class="jobs-unified-top-card">
    <h1 class="t-24 t-bold jobs-unified-top-card__job-title">Staff Engineer</h1>
    <div class="jobs-unified-top-card__primary-description">
      <a class="jobs-unified-top-card__company-name" href="/company/globex/">Globex</a> · Springfield, IL · 1 week ago · 57 applicants
    </div>
    <ul>
      <li class="jobs-unified-top-card__job-insight"><span>Contract · Mid-Senior level</span></li>
      <li class="jobs-unified-top-card__job-insight"><span>$70/hr - $85/hr</span></li>
      <li class="jobs-unified-top-card__job-insight"><span>On-site</span></li>
    </ul>
    <div class="jobs-s-apply"><button class="jobs-apply-button" aria-label="Apply to Staff Engineer on company website"><span>Apply</span></button></div>
  </div>
  <article class="jobs-description__container">
    <div class="jobs-description-content__text"><p>Six-month contract, likely to extend.</p><ul><li>Rust and Go</li></ul></div>
  </article>
</main>
</body>
</html>
