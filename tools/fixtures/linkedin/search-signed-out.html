<!DOCTYPE html>
<!-- A reduced model of LinkedIn's signed-OUT ("guest") job search: a flat base-card list. -->
<html lang="en">
<head><title>.NET Developer jobs | LinkedIn</title></head>
<body>
<nav class="nav"><a class="nav__button-secondary" href="https://www.linkedin.com/login">Sign in</a></nav>
<main>
  <section class="two-pane-serp-page__results-list">
    <ul class="jobs-search__results-list">
      <li>
        <div class="base-card relative base-card--link base-search-card job-search-card" data-entity-urn="urn:li:jobPosting:4099000001">
          <a class="base-card__full-link" href="https://www.linkedin.com/jobs/view/net-developer-at-initrode-4099000001?position=1">
            <span class="sr-only">.NET Developer</span>
          </a>
          <div class="base-search-card__info">
            <h3 class="base-search-card__title">.NET Developer</h3>
            <h4 class="base-search-card__subtitle"><a href="/company/initrode">Initrode</a></h4>
            <div class="base-search-card__metadata">
              <span class="job-search-card__location">Austin, TX</span>
              <time class="job-search-card__listdate" datetime="2026-09-20">3 days ago</time>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
